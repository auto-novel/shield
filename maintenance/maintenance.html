<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>网站维护中</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        color: #273043;
        background: #f5f7fb;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
      }

      p {
        margin: 0;
        color: #667085;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #f2f4f7;
          background: #101828;
        }

        p {
          color: #98a2b3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>网站维护中</h1>
      <p>我们正在进行系统维护，请稍后再来。</p>
    </main>
  </body>
</html>

      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        color: #f2f4f7;
        background: #161616;
        place-items: center;
        isolation: isolate;
      }

      .maintenance-backdrop {
        position: fixed;
        z-index: -1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background: #161616;
      }

      .maintenance-tapes {
        /* One viewport-based unit keeps type, spacing and texture in proportion
           at every browser zoom. The height term also covers tall screens. */
        --band-height: max(20.3vw, 22.5vh);
        --pattern-unit: calc(var(--band-height) / 260);
        position: absolute;
        top: 50%;
        left: -15%;
        width: 130%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transform: translateY(-50%) skewY(-22deg);
        background: #171719;
      }

      .maintenance-tape {
        position: relative;
        flex: 0 0 var(--band-height);
        overflow: hidden;
      }

      .maintenance-tape::before {
        content: "NOVELIA PAUSE NOVELIA PAUSE NOVELIA PAUSE NOVELIA PAUSE NOVELIA PAUSE NOVELIA PAUSE";
        display: block;
        height: calc(var(--band-height) * 0.57);
        padding-block: calc(var(--band-height) * 0.03);
        color: #111113;
        background: #737375;
        font-family: "Maintenance Anton", sans-serif;
        font-size: calc(var(--band-height) * 0.65);
        font-weight: 400;
        line-height: 0.86;
        letter-spacing: -0.025em;
        white-space: nowrap;
        text-indent: -0.3em;
        -webkit-text-stroke: calc(var(--pattern-unit) * 1.8) #111113;
      }

      .maintenance-tape:nth-child(even)::before {
        text-indent: -3.95em;
      }

      .maintenance-decoration {
        position: absolute;
        top: calc(var(--band-height) * 0.67);
        bottom: calc(var(--band-height) * 0.04);
        left: -10%;
        width: 120%;
        transform: skewX(-28deg);
      }

      /* Three wide warning bars, followed by an isolated halftone patch. */
      .maintenance-decoration::before,
      .maintenance-decoration::after {
        content: "";
        position: absolute;
        inset: 0;
      }

      .maintenance-decoration::before {
        background: repeating-linear-gradient(to right,
          #77777a 0 calc(var(--pattern-unit) * 54), transparent calc(var(--pattern-unit) * 54) calc(var(--pattern-unit) * 108),
          #77777a calc(var(--pattern-unit) * 108) calc(var(--pattern-unit) * 162), transparent calc(var(--pattern-unit) * 162) calc(var(--pattern-unit) * 216),
          #77777a calc(var(--pattern-unit) * 216) calc(var(--pattern-unit) * 270), transparent calc(var(--pattern-unit) * 270) calc(var(--pattern-unit) * 570));
      }

      .maintenance-decoration::after {
        background: radial-gradient(ellipse, #8c8c90 0 calc(var(--pattern-unit) * 1.3), transparent calc(var(--pattern-unit) * 1.9));
        background-size: calc(var(--pattern-unit) * 8) calc(var(--pattern-unit) * 7);
        mask-image: radial-gradient(ellipse calc(var(--pattern-unit) * 105) 65% at calc(var(--pattern-unit) * 425) 50%, #000 20%, transparent 100%);
        mask-size: calc(var(--pattern-unit) * 570) 100%;
        mask-repeat: repeat;
      }

      .maintenance-tape:nth-child(even) .maintenance-decoration {
        margin-left: calc(var(--pattern-unit) * 230);
      }

      .maintenance-backdrop::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at center, #10101270, transparent 72%),
          linear-gradient(#0002, #0002);
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        padding-block: 2rem;
        text-align: center;
        text-shadow: 0 2px 12px #000;
      }

      img {
        display: block;
        width: min(12rem, 50vw);
        height: auto;
        margin: 0 auto 1.5rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
      }

      p {
        margin: 0;
        color: #d0d0d0;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      p + p {
        margin-top: 0.5rem;
      }

    </style>
  </head>
  <body>
    <div class="maintenance-backdrop" aria-hidden="true">
      <div class="maintenance-tapes">
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
        <div class="maintenance-tape"><span class="maintenance-decoration"></span></div>
      </div>
    </div>
    <main>
      <img src="./girl.webp" />
      <h1>网站维护中</h1>
      <p>
        预计还需<strong id="maintenance-countdown"
          >{{MAINTENANCE_DURATION}}</strong
        >，将于<time id="maintenance-end" datetime="{{MAINTENANCE_END_ISO}}"
          >{{MAINTENANCE_END}}</time
        >恢复
      </p>
    </main>
    <script>
      const countdown = document.querySelector("#maintenance-countdown");
      const end = document.querySelector("#maintenance-end");
      const endDate = new Date(end.dateTime);
      const endTime = endDate.getTime();
      let wasPending = false;

      function localDayNumber(date) {
        return Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function formatEndTime() {
        if (!Number.isFinite(endTime)) return;

        const now = new Date();
        const dayDifference =
          (localDayNumber(endDate) - localDayNumber(now)) / 86_400_000;
        const time = new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        }).format(endDate);

        if (dayDifference === 0) {
          end.textContent = `今天 ${time}`;
          return;
        }
        if (dayDifference === 1) {
          end.textContent = `明天 ${time}`;
          return;
        }

        end.textContent = new Intl.DateTimeFormat("zh-CN", {
          year:
            endDate.getFullYear() === now.getFullYear() ? undefined : "numeric",
          month: "long",
          day: "numeric",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        }).format(endDate);
      }

      function updateCountdown() {
        const remaining = endTime - Date.now();
        if (!Number.isFinite(endTime)) {
          countdown.textContent = "未知";
          return;
        }
        if (remaining <= 0) {
          countdown.textContent = "等待恢复";
          if (wasPending) {
            window.location.reload();
          }
          return;
        }

        wasPending = true;
        const totalMinutes = Math.ceil(remaining / 60_000);
        const days = Math.floor(totalMinutes / (24 * 60));
        const hours = Math.floor((totalMinutes % (24 * 60)) / 60);
        const minutes = totalMinutes % 60;
        const parts = [];

        if (days > 0) parts.push(`${days} 天`);
        if (hours > 0) parts.push(`${hours} 小时`);
        if (minutes > 0) parts.push(`${minutes} 分钟`);
        countdown.textContent = parts.join(" ");
      }

      formatEndTime();
      updateCountdown();
      window.setInterval(updateCountdown, 10_000);
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="60" />
    <title>网站维护中</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        color: #273043;
        background: #f5f7fb;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        text-align: center;
      }

      img {
        display: block;
        width: min(12rem, 50vw);
        height: auto;
        margin: 0 auto 1.5rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
      }

      p {
        margin: 0;
        color: #667085;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      p + p {
        margin-top: 0.5rem;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #f2f4f7;
          background: #101828;
        }

        p {
          color: #98a2b3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/maintenance-girl.webp" />
      <h1>网站维护中</h1>
      <p>
        预计还需<strong id="maintenance-countdown"
          >{{MAINTENANCE_DURATION}}</strong
        >，将于<time id="maintenance-end" datetime="{{MAINTENANCE_END_ISO}}"
          >{{MAINTENANCE_END}}</time
        >恢复
      </p>
    </main>
    <script>
      const countdown = document.querySelector("#maintenance-countdown");
      const end = document.querySelector("#maintenance-end");
      const endDate = new Date(end.dateTime);
      const endTime = endDate.getTime();
      let wasPending = false;

      function localDayNumber(date) {
        return Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function formatEndTime() {
        if (!Number.isFinite(endTime)) return;

        const now = new Date();
        const dayDifference =
          (localDayNumber(endDate) - localDayNumber(now)) / 86_400_000;
        const time = new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        }).format(endDate);

        if (dayDifference === 0) {
          end.textContent = `今天 ${time}`;
          return;
        }
        if (dayDifference === 1) {
          end.textContent = `明天 ${time}`;
          return;
        }

        end.textContent = new Intl.DateTimeFormat("zh-CN", {
          year:
            endDate.getFullYear() === now.getFullYear() ? undefined : "numeric",
          month: "long",
          day: "numeric",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        }).format(endDate);
      }

      function updateCountdown() {
        const remaining = endTime - Date.now();
        if (!Number.isFinite(endTime)) {
          countdown.textContent = "未知";
          return;
        }
        if (remaining <= 0) {
          countdown.textContent = "等待恢复";
          if (wasPending) {
            window.location.reload();
          }
          return;
        }

        wasPending = true;
        const totalMinutes = Math.ceil(remaining / 60_000);
        const days = Math.floor(totalMinutes / (24 * 60));
        const hours = Math.floor((totalMinutes % (24 * 60)) / 60);
        const minutes = totalMinutes % 60;
        const parts = [];

        if (days > 0) parts.push(`${days} 天`);
        if (hours > 0) parts.push(`${hours} 小时`);
        if (minutes > 0) parts.push(`${minutes} 分钟`);
        countdown.textContent = parts.join(" ");
      }

      formatEndTime();
      updateCountdown();
      window.setInterval(updateCountdown, 10_000);
    </script>
  </body>
</html>

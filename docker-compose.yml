networks:
  default:
    name: status
    driver: bridge

services:
  caddy:
    image: caddybuilds/caddy-cloudflare:2.10.0
    restart: always
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?}
    ports:
      - 443:443
    volumes:
      - ./data/caddy:/data
      - ./caddy:/etc/caddy:ro
      - ./srv:/srv:ro
    cap_add:
      - NET_ADMIN
